name: Frontend Lint

on:
  pull_request:
    paths:
      - 'web/**'
      - 'labels/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/frontend-lint.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - 'labels/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/frontend-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # GitHub Actions does not follow repository renames for uses: references -
    # keep this in sync with the real repository name.
    uses: mochi-os/web/.github/workflows/reusable-frontend-lint.yml@main
    with:
      web_dir: web
      node_version: '20'
    secrets: inherit

